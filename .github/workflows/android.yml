name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (prayer engine)
        run: ./gradlew :core:test --stacktrace
      - name: Cache bundled recitation audio
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/audio
          key: bundled-audio-${{ hashFiles('scripts/fetch-bundled-audio.sh') }}
      - name: Fetch bundled recitation audio (33 short surahs)
        # The app streams anything missing, so a flaky download should not fail the build.
        continue-on-error: true
        run: scripts/fetch-bundled-audio.sh
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: salahsync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
